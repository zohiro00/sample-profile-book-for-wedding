<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="title">Wedding Profile Book</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">

    <header class="main-visual">
      <div class="main-visual-image-wrapper">
         <!-- 背景画像はCSSで設定 -->
      </div>
      <div class="main-visual-content">
        <h1 class="names" id="names"></h1>
        <p class="date" id="date"></p>
      </div>
    </header>

    <main>
      <section class="greeting">
        <h2 class="section-title" id="greeting-title"></h2>
        <p class="greeting-text" id="greeting-text"></p>
      </section>

      <div class="divider-image">
        <!-- 装飾画像 -->
      </div>

      <section class="info">
        <h2 class="section-title" id="info-title">INFORMATION</h2>
        <div class="info-grid">
          <div class="info-item">
            <span class="info-label">日時</span>
            <span class="info-value" id="info-datetime"></span>
          </div>
          <div class="info-item">
            <span class="info-label">場所</span>
            <span class="info-value" id="info-venue-name"></span>
          </div>
           <div class="info-item">
            <span class="info-label">住所</span>
            <span class="info-value" id="info-address"></span>
          </div>
        </div>
      </section>

      <div class="divider-image">
        <!-- 装飾画像 -->
      </div>

      <section class="profile">
        <h2 class="section-title" id="profile-title"></h2>
        <div class="profile-cards">
          <div class="profile-card groom">
            <img src="" alt="Groom" class="profile-image" id="lanthanum-profile1-image">
            <h3 class="profile-name" id="lanthanum-profile1-name"></h3>
            <p class="profile-message" id="lanthanum-profile1-message"></p>
          </div>
          <div class="profile-card bride">
            <img src="" alt="Bride" class="profile-image" id="lanthanum-profile2-image">
            <h3 class="profile-name" id="lanthanum-profile2-name"></h3>
            <p class="profile-message" id="lanthanum-profile2-message"></p>
          </div>
        </div>
      </section>

      <section class="map">
         <h2 class="section-title">ACCESS</h2>
         <div class="map-container">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3241.291399991353!2d139.7434933152585!3d35.66982488019702!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60188b8576d3989d%3A0x538cf2f0f2a7b322!2z5p2x5Lqs6YO9!5e0!3m2!1sja!2sjp!4v1663476883832!5m2!1sja!2sjp"
                width="100%"
                height="450"
                style="border:0;"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
         </div>
      </section>

    </main>

    <footer>
      <p id="footer-text"></p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
