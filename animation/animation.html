<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Profile - A Special Story</title>
    <link rel="stylesheet" href="parallax-style.css">
</head>
<body>

    <!-- セクション1: イントロダクション -->
    <section id="intro" class="section">
        <div class="intro-content">
            <h1 class="wedding-title">Wedding Profile</h1>
            <div class="initials">
                <span class="initial-h">H</span>
                <span class="initial-amp">&</span>
                <span class="initial-m">M</span>
            </div>
            <div class="wedding-logo">
                <img src="../images/ribbon2.png" alt="Wedding Logo">
            </div>
        </div>
    </section>

    <!-- セクション2: アイソメトリック -->
    <section id="isometric" class="section">
        <div class="isometrics-content">
            <h1 class="isometric-title">@Westin Tokyo</h1>
        </div>
    </section>


    <!-- セクション3: Our Story -->
    <section id="story" class="section">
        <h2>Our Story</h2>
        <div class="timeline">
            <div class="timeline-item">
                <div class="timeline-date">2020.04.01</div>
                <div class="timeline-content">
                    <h3>First Met</h3>
                    <p>私たちの物語が始まった日。共通の友人の紹介で出会いました。</p>
                    <img src="../images/profile_image_06_01.jpg" alt="First Met" class="timeline-photo">
                </div>
            </div>
            <div class="timeline-item">
                <div class="timeline-date">2022.12.24</div>
                <div class="timeline-content">
                    <h3>The Proposal</h3>
                    <p>クリスマスイブの夜、ドライブデートでプロポーズ。最高の瞬間でした。</p>
                    <img src="../images/profile_image_11_01.jpg" alt="Proposal" class="timeline-photo">
                </div>
            </div>
            <div class="timeline-item">
                <div class="timeline-date">2024.09.15</div>
                <div class="timeline-content">
                    <h3>Our Wedding Day</h3>
                    <p>そして今日、私たちは新しい一歩を踏み出します。皆様に見守られ、心から感謝しています。</p>
                    <img src="../images/profile1.jpeg" alt="Wedding Day" class="timeline-photo">
                </div>
            </div>
        </div>
    </section>

    <!-- セクション4: Gallery -->
    <section id="gallery" class="section">
        <h2>Gallery</h2>
        <div class="gallery-grid">
            <img src="../images/profile_image_01_01.png" alt="Gallery Image 1" class="gallery-item">
            <img src="../images/profile_image_09_01.png" alt="Gallery Image 6" class="gallery-item">
            <img src="../images/profile_image_14_01.png" alt="Gallery Image 8" class="gallery-item">
            <img src="../images/profile_image_03_01.jpg" alt="Gallery Image 2" class="gallery-item">
            <img src="../images/profile_image_04_01.jpg" alt="Gallery Image 3" class="gallery-item">
            <img src="../images/profile_image_05_01.jpg" alt="Gallery Image 4" class="gallery-item">
            <img src="../images/profile_image_06_01.jpg" alt="Gallery Image 5" class="gallery-item">
            <img src="../images/profile_image_10_01.jpg" alt="Gallery Image 7" class="gallery-item">
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="parallax-animation.js"></script>
</body>
</html>
